name: Cargolux
kind: company
description: >-
  Cargolux Airlines International S.A. is Europe's largest all-cargo airline, headquartered
  at Luxembourg Findel Airport in Luxembourg and operating a global Boeing 747 freighter
  network under IATA designator CV and air waybill prefix 172 (with Cargolux Italia on
  prefix 356). In the logistics chain Cargolux is the main-leg air carrier: it sells
  capacity to freight forwarders and general sales agents rather than to shippers, hands
  cargo to terminal and ground handling operators such as its Luxcargo Handling subsidiary,
  and files customs and security data on behalf of the contracted forwarder. Its API
  posture is honestly a customer-contract one. Cargolux publishes no developer portal and
  no machine-readable contract of any kind — developer.cargolux.com, developers.cargolux.com
  and docs.cargolux.com do not resolve, and /developers, /api, /openapi.json, /swagger.json,
  /api-docs and /.well-known/ all return 404 on www.cargolux.com. The only public
  self-service surfaces are HTML: a track-and-trace widget and a flight scheduler on the
  marketing site, plus a login-walled Customer Portal at my.cargolux.com. A real quote-and-
  booking API exists, but it is a bilateral, commercially negotiated forwarder interface —
  piloted with Kuehne+Nagel in 2021 and extended to DB Schenker — with no published
  reference, and it is complemented by indirect distribution through the cargo.one, CargoAi
  and WebCargo by Freightos marketplaces. Underneath, Cargolux runs IBS Software's iCargo
  SaaS cargo management system and holds a large minority stake in Luxembourg's CHAMP
  Cargosystems, whose developer.champ.aero portal is the developer surface Cargolux's
  ecosystem actually reads — CHAMP's, not Cargolux's. IATA e-AWB "Single Process" is
  documented; no IATA ONE Record or Cargo-XML publication was found.
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.

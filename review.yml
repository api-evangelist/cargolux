actions:
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  reason: >-
    apis[] is empty and no openapi/ directory exists because Cargolux publishes no
    documented API. The undocumented iCargo website backend was found and recorded with its
    HTTP evidence but was deliberately not promoted to an apis[] entry, and no specification
    was reverse-engineered from it. An air carrier that helped shape the industry's
    digitalization agenda and publishes zero callable contracts at its own edge is the exact
    finding this study exists to record.
